server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Сжатие: основной вес — html, css, js
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml application/xml;

    # Листинг каталогов не нужен
    autoindex off;

    # Слайды — одна страница, поэтому index.html кэшировать не даём
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Статика с хэшем в имени не нужна, но картинки/шрифты меняются редко
    location ~* \.(webp|png|jpg|jpeg|svg|woff2|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Не отдавать скрытые файлы (.git, .dockerignore и т.п.)
    location ~ /\. {
        deny all;
    }
}
